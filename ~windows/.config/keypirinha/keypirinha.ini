# Keypirinha: copied to ~\scoop\persist\keypirinha\portable\Profile\User\Keypirinha.ini
# by ~windows/setup.ps1 (-Force to overwrite). Defaults and every option:
# Keypirinha menu > Configure Keypirinha, left pane.

[app]
# Started by the shortcut setup.ps1 puts in the Startup folder
launch_at_startup = no
# CapsLock+Space sends this too (autohotkey/main.ahk)
hotkey_run = Alt+Space
ignored_packages = <All>, -Internal, -URL, -TaskSwitcher, -RegBrowser, -Everything, -Env, -ControlPanel, -Calc, -Apps, -ShareX

[gui]
geometry = mouse_monitor
hide_on_focus_lost = yes
escape_always_closes = yes
theme = OneDarkBar

# Same palette and font as the YASB bar (yasb/styles.css): dark pill, blue
# selection like the focused workspace, grey for everything secondary
[theme/OneDarkBar]
font_face = JetBrainsMono NF, Segoe UI
font_small_size = 9
font_small_style = cleartype
font_snormal_size = 11
font_snormal_style = cleartype
font_normal_size = 11
font_normal_style = cleartype
font_large_size = 16
font_large_style = cleartype
mono_font_face = JetBrainsMono NF

color_background = #1e2127
color_foreground = #d7dae0
color_faded = #5c6370
color_accent = #61afef
color_warn = #e06c75
color_title = ${color_foreground}
color_status = ${color_faded}
color_textbox_back = #282c34
color_listitem_back = ${color_background}
color_listitem_title = ${color_foreground}
color_listitem_desc = ${color_faded}
color_listitem_tips = ${color_faded}
color_listitem_selected_back = #61afef
color_listitem_selected_title = #1e2127
color_listitem_selected_desc = #2c313a
color_listitem_selected_tips = #2c313a
opacity_back = 96

layout = list_icon, list_actions
compact_results = yes
satellite_show = never
control_margin = 8
textbox_padding = 6
listitem_padding = 4
listitem_title_font = snormal
