# YASB — top bar replacing the hidden taskbar. Loaded through YASB_CONFIG_HOME,
# set by ~windows/setup.ps1. Options: https://github.com/amnweb/yasb/tree/main/docs
watch_stylesheet: true
watch_config: true
debug: false
update_check: false

glazewm:
  start_command: "glazewm.exe start"
  stop_command: "glazewm.exe command wm-exit"
  reload_command: "glazewm.exe command wm-reload-config"

bars:
  main:
    screens: [ "*" ]
    # Floating bar lined up with GlazeWM's 10px gaps
    padding:
      top: 8
      left: 10
      bottom: 0
      right: 10
    alignment:
      position: "top"
    animation:
      enabled: false
    window_flags:
      always_on_top: false
      windows_app_bar: true
      hide_on_fullscreen: true
    dimensions:
      width: "100%"
      height: 34
    widgets:
      left: [ "home", "glazewm_workspaces", "glazewm_binding_mode", "active_window" ]
      center: [ "media" ]
      right: [ "systray", "battery", "cpu", "memory", "volume", "notifications", "clock" ]

widgets:
  home:
    type: "yasb.home.HomeWidget"
    options:
      label: ""
      menu_list:
      - { title: "Home", path: "~" }
      - { title: "Downloads", path: "~\\Downloads" }
      - { title: "Repos", path: "~\\repos" }
      - { separator: true }
      - { title: "Dark / light theme", command: "powershell.exe", args: [ "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:DOTFILES_DIR\\~windows\\scripts\\switch-theme.ps1\"" ], show_window: false }
      system_menu: true
      power_menu: true

  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM offline"
      hide_if_offline: false
      monitor_exclusive: true
      # The active window already shows its icon; icons here crowd the labels
      app_icons:
        enabled_populated: false
        enabled_active: false

  glazewm_binding_mode:
    type: "glazewm.binding_mode.GlazewmBindingModeWidget"
    options:
      label: "<span>{icon}</span> {binding_mode}"
      hide_if_no_active: true
      icons:
        none: ""
        resize: "󰩻"
        service: ""
        pause: ""

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[process][name]}"
      label_no_window: ""
      label_icon: true
      label_icon_size: 14
      max_length: 48
      max_length_ellipsis: "…"
      monitor_exclusive: true

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}"
      label_alt: "{artist} — {title}"
      hide_empty: true
      show_thumbnail: false
      controls_left: false
      max_field_size:
        label: 40
        label_alt: 60

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      label_collapsed: ""
      label_expanded: ""
      icon_size: 16
      show_unpinned: false
      show_unpinned_button: true

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span></span> {info[percent][total]}%"
      label_alt: "<span></span> {info[histograms][cpu_percent]}"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_right: "exec cmd /c Taskmgr"

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>󰍛</span> {virtual_mem_percent}%"
      label_alt: "<span>󰍛</span> {virtual_mem_free} free"
      update_interval: 5000
      hide_decimal: true

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "<span>{icon}</span> {level}"
      audio_menu:
        show_apps: true

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span> {wifi_name}"
      update_interval: 5000

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {time_remaining}"
      time_remaining_natural: true
      charging_options:
        icon_format: "{charging_icon}"

  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span>{icon}</span> {count}"
      label_alt: "{count} notifications"
      hide_empty: true
      # Left click opens the Windows notification center (Win+A)
      callbacks:
        on_left: "toggle_notification"
        on_middle: "toggle_label"
        on_right: "clear_notifications"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%a %d %b %H:%M}"
      label_alt: "{%a %d %b  %H:%M}"
      locale: "fr_FR"
